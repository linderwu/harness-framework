    <rect class="node component" x="560" y="70" width="220" height="120" rx="8" fill="#eef0ff" />
    <text class="node-title" x="576" y="98">Project Routes</text>
    <text class="node-desc" x="576" y="122">Create/list projects and</text>
    <text class="node-desc" x="576" y="138">project-scoped runs.</text>
    <rect class="node component" x="820" y="70" width="220" height="120" rx="8" fill="#eef0ff" />
    <text class="node-title" x="836" y="98">Workflow Run Routes</text>
    <text class="node-desc" x="836" y="122">Create/read/advance/stop/cancel</text>
    <text class="node-desc" x="836" y="138">workflow runs.</text>
    <rect class="node component" x="560" y="240" width="220" height="120" rx="8" fill="#eef0ff" />
    <text class="node-title" x="576" y="268">Approval Gate Routes</text>
    <text class="node-desc" x="576" y="292">Apply approval decisions.</text>
    <rect class="node component" x="820" y="240" width="220" height="120" rx="8" fill="#eef0ff" />
    <text class="node-title" x="836" y="268">Agent Health Routes</text>
    <text class="node-desc" x="836" y="292">Probe configured bridge health.</text>
